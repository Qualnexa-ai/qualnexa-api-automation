name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Runs the same checks against the live Petstore API on a schedule, since
  # the target is a shared third-party sandbox whose data/behavior can drift
  # between pushes (observed directly during Days 1-20). This is deliberately
  # just a visible scheduled run in the Actions tab — no alerting/notification
  # wiring is added here.
  schedule:
    - cron: '0 6 * * *'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint

      - run: npm test

      - run: npm run format:check

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: reports/
          retention-days: 14
